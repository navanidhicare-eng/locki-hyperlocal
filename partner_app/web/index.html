<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="partner_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>partner_app</title>
  <link rel="manifest" href="manifest.json">
  <script>
    var _lokiAudioCtx = null;
    var _lokiSirenTimer = null;
    var _lokiSirenActive = false;

    function getLokiAudioContext() {
      if (!_lokiAudioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          _lokiAudioCtx = new AudioContext();
        }
      }
      if (_lokiAudioCtx && _lokiAudioCtx.state === 'suspended') {
        _lokiAudioCtx.resume();
      }
      return _lokiAudioCtx;
    }

    ['click', 'touchstart', 'keydown'].forEach(function(evt) {
      window.addEventListener(evt, function unlockAudio() {
        getLokiAudioContext();
      });
    });

    // High-decibel piercing motorcycle traffic emergency siren blast
    function playSingleBikeSirenBlast() {
      try {
        const ctx = getLokiAudioContext();
        if (!ctx) return;

        // Dynamics Compressor to boost loudness without speaker clipping
        const compressor = ctx.createDynamicsCompressor();
        compressor.threshold.setValueAtTime(-10, ctx.currentTime);
        compressor.knee.setValueAtTime(30, ctx.currentTime);
        compressor.ratio.setValueAtTime(18, ctx.currentTime);
        compressor.attack.setValueAtTime(0.001, ctx.currentTime);
        compressor.release.setValueAtTime(0.15, ctx.currentTime);
        compressor.connect(ctx.destination);

        const now = ctx.currentTime;

        // 1. Sharp Sawtooth Siren Wave (Emergency horn sweep 950Hz -> 2800Hz)
        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.type = 'sawtooth';
        osc1.frequency.setValueAtTime(950, now);
        osc1.frequency.exponentialRampToValueAtTime(2600, now + 0.22);
        osc1.frequency.exponentialRampToValueAtTime(1100, now + 0.45);
        osc1.frequency.exponentialRampToValueAtTime(2800, now + 0.68);
        osc1.frequency.exponentialRampToValueAtTime(900, now + 0.88);
        gain1.gain.setValueAtTime(0.9, now);
        gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.90);
        osc1.connect(gain1);
        gain1.connect(compressor);
        osc1.start(now);
        osc1.stop(now + 0.90);

        // 2. High-cut piercing Square Wave sub-octave horn
        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = 'square';
        osc2.frequency.setValueAtTime(1400, now);
        osc2.frequency.setValueAtTime(1850, now + 0.22);
        osc2.frequency.setValueAtTime(1400, now + 0.45);
        osc2.frequency.setValueAtTime(1950, now + 0.68);
        gain2.gain.setValueAtTime(0.6, now);
        gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.90);
        osc2.connect(gain2);
        gain2.connect(compressor);
        osc2.start(now);
        osc2.stop(now + 0.90);

        // 3. Repeating phone vibration pulse for pocket alert
        if (navigator.vibrate) {
          navigator.vibrate([400, 100, 400, 100]);
        }
      } catch (e) {
        console.warn('Bike siren audio error:', e);
      }
    }

    // Continuous Repeating Bike Traffic Siren (loops until driver accepts/cancels)
    window.playLokiPartnerAlarm = function() {
      window.stopLokiPartnerAlarm();
      _lokiSirenActive = true;
      playSingleBikeSirenBlast();
      _lokiSirenTimer = setInterval(function() {
        if (!_lokiSirenActive) {
          clearInterval(_lokiSirenTimer);
          return;
        }
        playSingleBikeSirenBlast();
      }, 1050);

      // Auto stop after 45 seconds timeout to save battery if ignored
      setTimeout(function() {
        window.stopLokiPartnerAlarm();
      }, 45000);
    };

    window.stopLokiPartnerAlarm = function() {
      _lokiSirenActive = false;
      if (_lokiSirenTimer) {
        clearInterval(_lokiSirenTimer);
        _lokiSirenTimer = null;
      }
      if (navigator.vibrate) {
        navigator.vibrate(0);
      }
    };

    // Camera capture, gallery picker and HTML canvas compression utility

    // Keyframe animations for Live Facial Scanner
    const lokiStyle = document.createElement('style');
    lokiStyle.innerHTML = `
      @keyframes lokiRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes lokiBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }
    `;
    document.head.appendChild(lokiStyle);

    // Dedicated AI Live Facial Selfie & Liveness Scanner (Strictly Live Camera, No Gallery)
    window.lokiOpenLiveSelfieScanner = function(callback) {
      const constraints = {
        video: {
          facingMode: { ideal: 'user' },
          width: { ideal: 640 },
          height: { ideal: 640 }
        },
        audio: false
      };

      navigator.mediaDevices.getUserMedia(constraints).then(function(stream) {
        const overlay = document.createElement('div');
        overlay.id = 'lokiLiveSelfieOverlay';
        overlay.style.position = 'fixed';
        overlay.style.top = '0';
        overlay.style.left = '0';
        overlay.style.width = '100vw';
        overlay.style.height = '100vh';
        overlay.style.backgroundColor = 'rgba(10, 15, 30, 0.90)';
        overlay.style.backdropFilter = 'blur(10px)';
        overlay.style.webkitBackdropFilter = 'blur(10px)';
        overlay.style.zIndex = '999999';
        overlay.style.display = 'flex';
        overlay.style.flexDirection = 'column';
        overlay.style.alignItems = 'center';
        overlay.style.justifyContent = 'center';
        overlay.style.fontFamily = 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        overlay.style.color = '#FFFFFF';
        overlay.style.userSelect = 'none';

        overlay.innerHTML = `
          <div style="background: #192338; border: 1px solid rgba(255,255,255,0.15); border-radius: 24px; max-width: 420px; width: 92%; padding: 24px 20px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.6); position: relative;">
            <!-- Close button -->
            <button id="lokiLiveCancelBtn" style="position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.12); border: none; color: #FFFFFF; font-size: 16px; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;">✕</button>

            <!-- Header -->
            <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 4px;">
              <span style="display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #EF4444; animation: lokiBlink 1s infinite;"></span>
              <h3 style="margin: 0; font-size: 16px; font-weight: 700; color: #FFFFFF;">AI Live Face Verification</h3>
            </div>
            <p style="margin: 0 0 16px 0; font-size: 12px; color: #94A3B8;">లైవ్ సెల్ఫీ కెమెరా (గ్యాలరీ అనుమతించబడదు)</p>

            <!-- Camera Viewport Circle with animated pulse ring -->
            <div style="position: relative; width: 250px; height: 250px; margin: 0 auto; display: flex; align-items: center; justify-content: center;">
              <div id="lokiScanRing" style="position: absolute; width: 246px; height: 246px; border-radius: 50%; border: 3px dashed #10B981; animation: lokiRotate 14s linear infinite; box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);"></div>
              <video id="lokiLiveVideo" autoplay playsinline muted style="width: 228px; height: 228px; border-radius: 50%; object-fit: cover; transform: scaleX(-1); background: #000; border: 3px solid #FFFFFF;"></video>
            </div>

            <!-- Dynamic Liveness Instructions -->
            <div id="lokiLivenessStatus" style="margin-top: 18px; padding: 10px 14px; background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 12px;">
              <p id="lokiLivenessText" style="margin: 0; font-size: 13px; font-weight: 600; color: #10B981;">
                👁️ కళ్ళు రెప్పలు కొట్టండి / Blink your eyes
              </p>
              <div style="display: flex; justify-content: center; gap: 8px; margin-top: 6px;">
                <span id="lokiBlinkDot1" style="font-size: 11px; padding: 2px 8px; border-radius: 10px; background: rgba(255,255,255,0.1); color: #94A3B8;">Blink 1</span>
                <span id="lokiBlinkDot2" style="font-size: 11px; padding: 2px 8px; border-radius: 10px; background: rgba(255,255,255,0.1); color: #94A3B8;">Blink 2</span>
              </div>
            </div>

            <!-- Capture Snap Button -->
            <button id="lokiSnapBtn" style="margin-top: 18px; width: 100%; padding: 13px; border-radius: 12px; border: none; background: #DE4915; color: #FFFFFF; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 15px rgba(222, 73, 21, 0.4);">
              <span>📸 SNAP LIVE PHOTO (క్యాప్చర్)</span>
            </button>
          </div>
        `;

        document.body.appendChild(overlay);

        const video = document.getElementById('lokiLiveVideo');
        video.srcObject = stream;

        let blinkCount = 0;
        let isCapturing = false;
        let blinkInterval = null;

        function cleanup() {
          if (blinkInterval) clearInterval(blinkInterval);
          stream.getTracks().forEach(function(track) { track.stop(); });
          if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
        }

        document.getElementById('lokiLiveCancelBtn').onclick = function() {
          cleanup();
          callback(JSON.stringify({ success: false, cancelled: true }));
        };

        function performCapture() {
          if (isCapturing) return;
          isCapturing = true;

          const canvas = document.createElement('canvas');
          canvas.width = 480;
          canvas.height = 480;
          const ctx = canvas.getContext('2d');

          // Mirror horizontally for selfie accuracy
          ctx.translate(480, 0);
          ctx.scale(-1, 1);

          const minDim = Math.min(video.videoWidth || 480, video.videoHeight || 480);
          const sx = ((video.videoWidth || 480) - minDim) / 2;
          const sy = ((video.videoHeight || 480) - minDim) / 2;
          ctx.drawImage(video, sx, sy, minDim, minDim, 0, 0, 480, 480);

          const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.75);
          const sizeKb = Math.round((compressedDataUrl.length * 3) / 4 / 1024);

          cleanup();

          callback(JSON.stringify({
            success: true,
            liveVerified: true,
            dataUrl: compressedDataUrl,
            fileSizeKb: sizeKb,
            fileName: 'live_facial_selfie.jpg'
          }));
        }

        document.getElementById('lokiSnapBtn').onclick = performCapture;

        // Eye Blink Detection Loop using offscreen canvas luminance differential
        const checkCanvas = document.createElement('canvas');
        checkCanvas.width = 40;
        checkCanvas.height = 20;
        const checkCtx = checkCanvas.getContext('2d', { willReadFrequently: true });
        let lastLuminance = null;
        let inBlinkDip = false;

        blinkInterval = setInterval(function() {
          if (isCapturing || !video.videoWidth) return;

          try {
            const eyeStartX = (video.videoWidth * 0.35);
            const eyeStartY = (video.videoHeight * 0.35);
            const eyeWidth = (video.videoWidth * 0.3);
            const eyeHeight = (video.videoHeight * 0.18);

            checkCtx.drawImage(video, eyeStartX, eyeStartY, eyeWidth, eyeHeight, 0, 0, 40, 20);
            const imgData = checkCtx.getImageData(0, 0, 40, 20).data;

            let totalLum = 0;
            for (let i = 0; i < imgData.length; i += 4) {
              totalLum += (0.299 * imgData[i] + 0.587 * imgData[i+1] + 0.114 * imgData[i+2]);
            }
            const avgLum = totalLum / (imgData.length / 4);

            if (lastLuminance !== null) {
              const diff = avgLum - lastLuminance;
              if (diff < -5.5 && !inBlinkDip) {
                inBlinkDip = true;
              } else if (diff > 4.5 && inBlinkDip) {
                inBlinkDip = false;
                blinkCount++;

                const dot1 = document.getElementById('lokiBlinkDot1');
                const dot2 = document.getElementById('lokiBlinkDot2');
                const txt = document.getElementById('lokiLivenessText');

                if (blinkCount === 1) {
                  if (dot1) {
                    dot1.style.background = '#10B981';
                    dot1.style.color = '#FFFFFF';
                    dot1.innerText = 'Blink 1 ✓';
                  }
                  if (txt) txt.innerText = '✅ 1st Blink Detected! Blink once more';
                } else if (blinkCount >= 2) {
                  if (dot2) {
                    dot2.style.background = '#10B981';
                    dot2.style.color = '#FFFFFF';
                    dot2.innerText = 'Blink 2 ✓';
                  }
                  if (txt) {
                    txt.innerText = '✅ Live Human Verified! Auto Capturing...';
                    txt.style.color = '#10B981';
                  }
                  setTimeout(performCapture, 600);
                }
              }
            }
            lastLuminance = avgLum;
          } catch (e) {}
        }, 120);

      }).catch(function(err) {
        console.error('Camera access error:', err);
        alert('Camera access error: ' + (err.message || 'Please allow camera permission in browser settings.'));
        callback(JSON.stringify({ success: false, message: 'Camera permission denied or camera not found' }));
      });
    };

    window.lokiPickAndCompressImage = function(sourceType, callback) {
      try {
        const input = document.createElement('input');
        input.type = 'file';

        if (sourceType === 'selfie') {
          // Front camera for live facial selfie
          input.accept = 'image/*';
          input.capture = 'user';
        } else if (sourceType === 'camera') {
          // Rear camera for documents & shop pictures
          input.accept = 'image/*';
          input.capture = 'environment';
        } else {
          // Gallery / Files (Image or PDF)
          input.accept = 'image/*,application/pdf';
        }

        input.style.position = 'fixed';
        input.style.left = '-9999px';
        input.style.top = '-9999px';
        document.body.appendChild(input);

        input.onchange = function(e) {
          const file = e.target.files && e.target.files[0];
          if (!file) {
            try { document.body.removeChild(input); } catch (err) {}
            callback(JSON.stringify({ success: false, cancelled: true }));
            return;
          }

          // If PDF, convert directly to Base64
          if (file.type === 'application/pdf') {
            const reader = new FileReader();
            reader.onload = function(evt) {
              try { document.body.removeChild(input); } catch (err) {}
              callback(JSON.stringify({
                success: true,
                isPdf: true,
                fileName: file.name,
                fileSizeKb: Math.round(file.size / 1024),
                dataUrl: evt.target.result
              }));
            };
            reader.onerror = function() {
              try { document.body.removeChild(input); } catch (err) {}
              callback(JSON.stringify({ success: false, message: 'Failed to read PDF file' }));
            };
            reader.readAsDataURL(file);
            return;
          }

          // If Image: compress using HTML Canvas to reduce size (max 1024px, JPEG 0.72)
          const reader = new FileReader();
          reader.onload = function(evt) {
            const img = new Image();
            img.onload = function() {
              const maxDim = 1024;
              let width = img.width;
              let height = img.height;

              if (width > maxDim || height > maxDim) {
                if (width > height) {
                  height = Math.round((height * maxDim) / width);
                  width = maxDim;
                } else {
                  width = Math.round((width * maxDim) / height);
                  height = maxDim;
                }
              }

              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);

              // Compress to JPEG with 0.72 quality
              const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.72);
              const approxSizeKb = Math.round((compressedDataUrl.length * 3) / 4 / 1024);

              try { document.body.removeChild(input); } catch (err) {}
              callback(JSON.stringify({
                success: true,
                isPdf: false,
                fileName: file.name,
                originalSizeKb: Math.round(file.size / 1024),
                fileSizeKb: approxSizeKb,
                dataUrl: compressedDataUrl
              }));
            };
            img.onerror = function() {
              try { document.body.removeChild(input); } catch (err) {}
              callback(JSON.stringify({ success: false, message: 'Failed to process image' }));
            };
            img.src = evt.target.result;
          };
          reader.onerror = function() {
            try { document.body.removeChild(input); } catch (err) {}
            callback(JSON.stringify({ success: false, message: 'Failed to read image file' }));
          };
          reader.readAsDataURL(file);
        };

        input.click();
      } catch (err) {
        console.error('lokiPickAndCompressImage error:', err);
        callback(JSON.stringify({ success: false, message: err.message }));
      }
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
